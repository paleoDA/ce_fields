# Data configuration file for ce_fields repository: simulated (PMIP4/CMIP6)
# and reconstructed (LMR, Neukom et al. 2019) Common Era climate fields.
#
# This file ships with the package and is machine-independent: external
# datasets have "/path/to/..." placeholders. Set their real locations in a
# data_config.local.yml next to this file (gitignored), or in any file named
# by the CE_FIELDS_LOCAL_CONFIG environment variable (see the README); either
# overrides the entries below key by key, e.g.
#   environments:
#     laptop:
#       paths:
#         lmr_data: "/my/data/LMR"
environments:
  laptop:
    root: ".."  # repository root (holds results/), for clones
    paths:
      results: "results"
      figures: "results/figures"
      pmip4_data: "/path/to/pmip4"
      cmip_hist_data: "/path/to/cmip_hist"
      lmr_data: "/path/to/lmr"
      neukom_data: "/path/to/neukom2019"
      hadcrut5_data: "/path/to/hadcrut5"
      crutem5_data: "/path/to/crutem5"
      berkeley_earth_data: "/path/to/berkeley_earth"
      dcent_data: "/path/to/dcent"

  hpc:
    root: ".."
    paths:
      results: "results"
      figures: "results/figures"
      pmip4_data: "/path/to/pmip4"
      cmip_hist_data: "/path/to/cmip_hist"
      lmr_data: "/path/to/lmr"
      neukom_data: "/path/to/neukom2019"
      hadcrut5_data: "/path/to/hadcrut5"
      crutem5_data: "/path/to/crutem5"
      berkeley_earth_data: "/path/to/berkeley_earth"
      dcent_data: "/path/to/dcent"

# File definitions
files:
  # PMIP4 last-millennium simulations (HPC only).  Keys follow the convention
  # pmip4_<ModelName> so that get_pmip4_models() can auto-discover them.
  # Similarly, cmip_hist_<ModelName> keys are auto-discovered by get_cmip_hist_models().
  #
  # {pmip4_data} / {cmip_hist_data} point at a shared root that holds both a
  # zarr/ and a netCDF/ subtree — storage format is a per-run choice, not a
  # property of the whole corpus, so every path below must spell out which
  # subtree it lives in explicitly.
  pmip4_ACCESS-ESM1-5:
    path: "{pmip4_data}/netCDF/CSIRO/ACCESS-ESM1-5/past1000/r1i1p1f1/Amon/tas/gn/v20230508/tas_Amon_ACCESS-ESM1-5_past1000_r1i1p1f1_gn_1850corrected.nc"
    description: "PMIP4 ACCESS-ESM1-5 past1000 r1i1p1f1 monthly tas, 1849->1850 flat-offset corrected (code/apply_1850_adjustments.py)"

  # Raw (pre-correction) counterpart of pmip4_ACCESS-ESM1-5, kept for
  # provenance/auditing. Not prefixed "pmip4_" so get_pmip4_models() doesn't
  # auto-discover it as a 10th model; load_stitched_tas(..., use_corrected=False)
  # resolves this key directly. See ce_fields.pmip4_config.CORRECTED_MODELS.
  raw_pmip4_ACCESS-ESM1-5:
    path: "{pmip4_data}/zarr/ACCESS-ESM1-5/past1000/r1i1p1f1/Amon/tas/tas_raw.zarr"
    description: "PMIP4 ACCESS-ESM1-5 past1000 r1i1p1f1 monthly tas, uncorrected"

  pmip4_EC-Earth3-Veg-LR:
    path: "{pmip4_data}/zarr/EC-Earth3-Veg-LR/past1000/r1i1p1f1/Amon/tas/tas_raw.zarr"
    description: "PMIP4 EC-Earth3-Veg-LR past1000 r1i1p1f1 monthly tas"

  pmip4_INM-CM4-8:
    path: "{pmip4_data}/zarr/INM-CM4-8/past1000/r1i1p1f1/Amon/tas/tas_raw.zarr"
    description: "PMIP4 INM-CM4-8 past1000 r1i1p1f1 monthly tas"

  pmip4_MIROC-ES2L:
    path: "{pmip4_data}/zarr/MIROC-ES2L/past1000/r1i1p1f2/Amon/tas/tas_raw.zarr"
    description: "PMIP4 MIROC-ES2L past1000 r1i1p1f2 monthly tas"

  pmip4_MPI-ESM1-2-LR:
    path: "{pmip4_data}/zarr/MPI-ESM1-2-LR/past2k/r1i1p1f1/Amon/tas/tas_raw.zarr"
    description: "PMIP4 MPI-ESM1-2-LR past2k r1i1p1f1 monthly tas"

  pmip4_MRI-ESM2-0:
    path: "{pmip4_data}/zarr/MRI-ESM2-0/past1000/r1i1p1f1/Amon/tas/tas_raw.zarr"
    description: "PMIP4 MRI-ESM2-0 past1000 r1i1p1f1 monthly tas"

  pmip4_iCESM:
    path: "{pmip4_data}/netCDF/iCESM/tas_sfc_Amon_iCESM_past1000historical_085001-200512.nc"
    description: "iCESM past1000+historical combined monthly tas NetCDF (850–2005 CE)"

  pmip4_CESM1.1:
    path: "{pmip4_data}/netCDF/CESM1.1"
    description: "CESM1.1 PMIP4 past2k monthly TREFHT (1–2005 CE; Zhong et al. 2018) in native CAM NetCDF format (HPC only)"

  pmip4_CESM2:
    path: "{pmip4_data}/netCDF/CESM2/corrected/TREFHT_Amon_CESM2_past1000_run002_1850corrected.nc"
    description: "CESM2 PMIP4 past1000 run002 monthly TREFHT (850–1849 CE), linear-detrend corrected for the past1000.002 volcanic-background drift artifact (code/apply_1850_adjustments.py)"

  # Raw (pre-correction) counterpart of pmip4_CESM2 -- see note above raw_pmip4_ACCESS-ESM1-5.
  raw_pmip4_CESM2:
    path: "{pmip4_data}/netCDF/CESM2"
    description: "CESM2 PMIP4 past1000 run002 monthly TREFHT in native CAM NetCDF format (850–1849 CE), uncorrected"

  # CMIP6 historical simulations (1850–2014) for stitching with PMIP4 past1000 runs.
  # Whether a given model is actually stitched is determined at runtime from the
  # PMIP4 run's last year — not from the presence of an entry here.
  #
  # NOTE — cmip_hist_CESM2 lives on a separate mount ("project2", not the shared
  # "common_data" root the other entries use) and so is left as a fully absolute
  # path rather than built from {cmip_hist_data}; it won't resolve on environments
  # that don't have that mount.
  cmip_hist_CESM2:
    path: "{cmip_hist_data}/netCDF/NCAR/CESM2/historical/r11i1p1f1/Amon/tas/gn/v20190514"
    description: "CESM2 CMIP6 historical r11i1p1f1 monthly tas NetCDF directory (1850–2014, 4 files)"

  cmip_hist_ACCESS-ESM1-5:
    path: "{cmip_hist_data}/zarr/ACCESS-ESM1-5/tas_raw.zarr"
    description: "CMIP6 ACCESS-ESM1-5 historical monthly tas (1850–2014)"

  cmip_hist_EC-Earth3-Veg-LR:
    path: "{cmip_hist_data}/zarr/EC-Earth3-Veg-LR/tas_raw.zarr"
    description: "CMIP6 EC-Earth3-Veg-LR historical monthly tas (1850–2014)"

  cmip_hist_INM-CM4-8:
    path: "{cmip_hist_data}/zarr/INM-CM4-8/tas_raw.zarr"
    description: "CMIP6 INM-CM4-8 historical monthly tas (1850–2014)"

  cmip_hist_MIROC-ES2L:
    path: "{cmip_hist_data}/netCDF/MIROC/MIROC-ES2L/historical/r1i1000p1f2/Amon/tas/gn/v20210107/tas_Amon_MIROC-ES2L_historical_r1i1000p1f2_gn_185001-201412.nc"
    description: "CMIP6 MIROC-ES2L historical r1i1000p1f2 monthly tas (1850–2014) — branched from the actual past1000/past2k Dec-1849 restart, replacing the PiControl-branched r1i1p1f1 member"

  cmip_hist_MPI-ESM1-2-LR:
    path: "{cmip_hist_data}/zarr/MPI-ESM1-2-LR/tas_raw.zarr"
    description: "CMIP6 MPI-ESM1-2-LR historical monthly tas (1850–2014)"

  cmip_hist_MRI-ESM2-0:
    path: "{cmip_hist_data}/netCDF/MRI/MRI-ESM2-0/historical/r1i1000p1f1/Amon/tas/gn/v20201029/tas_Amon_MRI-ESM2-0_historical_r1i1000p1f1_gn_185001-201412.nc"
    description: "CMIP6 MRI-ESM2-0 historical r1i1000p1f1 monthly tas (1850–2014) — branched from the actual past1000/past2k Dec-1849 restart, replacing the PiControl-branched r1i1p1f1 member"

  # Last Millennium Reanalysis (LMR) temperature field reconstructions:
  # v2.1, Online and Seasonal. See ce_fields/lmr.py.
  lmr_v2_1_tas_mean:
    path: "{lmr_data}/LMRv2.1/air_MCruns_ensemble_mean_LMRv2.1.nc"
    description: "LMR v2.1 ensemble mean spatial tas field"

  lmr_v2_1_tas_spread:
    path: "{lmr_data}/LMRv2.1/air_MCruns_ensemble_spread_LMRv2.1.nc"
    description: "LMR v2.1 ensemble spread spatial tas field"

  lmr_v2_1_gmst:
    path: "{lmr_data}/LMRv2.1/gmt_MCruns_ensemble_full_LMRv2.1.nc"
    description: "LMR v2.1 full GMST ensemble (time=2001, MCrun=20, members=100)"

  lmr_seasonal_tas_mean:
    path: "{lmr_data}/LMR_seasonal/ensemble_mean/tas_mean.nc"
    description: "LMR Seasonal ensemble mean spatial tas field"

  lmr_seasonal_tas_ens:
    path: "https://atmos.uw.edu/~zilumeng/LMR_Seasonal/data/members/tas/tas_ens*.nc"
    description: "LMR Seasonal full spatial tas ensemble (800 members) — use for BTP forward modelling"

  lmr_seasonal_gmst:
    path: "{lmr_data}/LMR_seasonal/index/GMT_ens.nc"
    description: "LMR Seasonal GMST ensemble (800 members, 800–2000 CE quarterly)"

  lmr_online_tas_mean:
    path: "{lmr_data}/LMRonline/production_ccsm4_pagesv2_wCoral_gis_seaslinobj_online_20m20sOHC_past1000/spatial_ens_mean.nc"
    description: "LMR Online ensemble mean spatial tas field (mean over 50 MC × 100 members)"

  lmr_online_tas_spread:
    path: "{lmr_data}/LMRonline/production_ccsm4_pagesv2_wCoral_gis_seaslinobj_online_20m20sOHC_past1000/spatial_ens_var.nc"
    description: "LMR Online ensemble variance spatial tas field"

  lmr_online_gmst:
    path: "{lmr_data}/LMRonline/production_ccsm4_pagesv2_wCoral_gis_seaslinobj_online_20m20sOHC_past1000/tas_sfc_indices.nc"
    description: "LMR Online GMST and regional indices (mc_iteration=50, ensemble_member=100, year=1001)"

  # Neukom et al. (2019, Nature) global gridded Common Era temperature field
  # reconstructions — six methods, each a 100-member ensemble, 5° resolution,
  # annual (May-April) resolution, 1-2000 CE. See ce_fields/neukom.py.
  neukom_am:
    path: "{neukom_data}/AM.nc"
    description: "Neukom2019 Analog Method (AM) 100-member gridded ensemble"

  neukom_cca:
    path: "{neukom_data}/CCA.nc"
    description: "Neukom2019 Canonical Correlation Analysis (CCA) 100-member gridded ensemble"

  neukom_cps:
    path: "{neukom_data}/CPS.nc"
    description: "Neukom2019 Composite-Plus-Scale (CPS) 100-member gridded ensemble"

  neukom_da:
    path: "{neukom_data}/DA.nc"
    description: "Neukom2019 Data Assimilation (DA) 100-member gridded ensemble (absolute temperature, K)"

  neukom_graphem:
    path: "{neukom_data}/GraphEM.nc"
    description: "Neukom2019 GraphEM 100-member gridded ensemble"

  neukom_pcr:
    path: "{neukom_data}/PCR.nc"
    description: "Neukom2019 Principal Component Regression (PCR) 100-member gridded ensemble"

  # Instrumental temperature products, loaded with
  # ce_fields.Instrumental.field(product, version, ...) (gridded) or
  # .series(product, version, region=...) (area means).
  # One entry per (product, version, variable, kind[, region]): the version is part of
  # the key and is never implied, because these products revise past values
  # from one release to the next. `version_check` names a global attribute of
  # the file and a string it must contain; the loader refuses a file that
  # fails it, so a newer download saved under an old name cannot slip in.
  # Adding a release is a pure YAML edit: copy an entry and change its
  # version, path and version_check.
  #
  # variable: tas  = the product's headline blended land air + SST anomaly
  #           lsat = land surface air temperature anomaly (land only)
  #           sst  = sea surface temperature anomaly
  # kind:     mean = ensemble mean / best estimate; members = ensemble members
  # region:   absent = gridded field; global, nh or sh = area-mean series
  instr_hadcrut5_5.0.1.0_tas_mean:
    path: "{hadcrut5_data}/HadCRUT.5.0.1.0.analysis.anomalies.ensemble_mean.nc"
    description: "HadCRUT5 v5.0.1.0 ensemble-mean monthly anomalies (rel. 1961-1990), 5x5 deg, 1850-2020"
    product: hadcrut5
    version: "5.0.1.0"
    variable: tas
    kind: mean
    var: tas_mean
    version_check: {attr: version, contains: "HadCRUT.5.0.1.0"}

  instr_hadcrut5_5.0.2.0_tas_mean:
    path: "{hadcrut5_data}/HadCRUT.5.0.2.0.analysis.anomalies.ensemble_mean.nc"
    description: "HadCRUT5 v5.0.2.0 ensemble-mean monthly anomalies (rel. 1961-1990), 5x5 deg, 1850-2025/02"
    product: hadcrut5
    version: "5.0.2.0"
    variable: tas
    kind: mean
    var: tas_mean
    version_check: {attr: version, contains: "HadCRUT.5.0.2.0"}

  instr_hadcrut5_5.1.0.0_tas_mean:
    path: "{hadcrut5_data}/HadCRUT.5.1.0.0.analysis.anomalies.ensemble_mean.nc"
    description: "HadCRUT5 v5.1.0.0 ensemble-mean monthly anomalies (rel. 1961-1990), 5x5 deg; this release is updated monthly, so its end date depends on the download"
    product: hadcrut5
    version: "5.1.0.0"
    variable: tas
    kind: mean
    var: tas_mean
    version_check: {attr: version, contains: "HadCRUT.5.1.0.0"}

  instr_hadcrut5_5.2.0.0_tas_mean:
    path: "{hadcrut5_data}/HadCRUT.5.2.0.0.analysis.anomalies.ensemble_mean.nc"
    description: "HadCRUT5 v5.2.0.0 ensemble-mean monthly anomalies (rel. 1961-1990), 5x5 deg, 1850-2026/09 (CRUTEM.5.2.0.0 + HadSST.4.2.0.0)"
    product: hadcrut5
    version: "5.2.0.0"
    variable: tas
    kind: mean
    var: tas_mean
    version_check: {attr: version, contains: "HadCRUT.5.2.0.0"}

  # Area-mean series published by the product itself (region: global, nh,
  # sh), loaded with Instrumental.series(); gridded entries have no region
  # field and are loaded with Instrumental.field(). Series files also hold
  # coverage_unc and area_fraction, which the loader does not return.
  instr_hadcrut5_5.2.0.0_tas_members_global:
    path: "{hadcrut5_data}/HadCRUT.5.2.0.0.analysis.ensemble_series.global.monthly.nc"
    description: "HadCRUT5 v5.2.0.0 global-mean monthly anomaly series (rel. 1961-1990), 200 realizations, 1850-2026/09"
    product: hadcrut5
    version: "5.2.0.0"
    variable: tas
    kind: members
    region: global
    var: tas
    version_check: {attr: version, contains: "HadCRUT.5.2.0.0"}

  instr_hadcrut5_5.2.0.0_tas_members_nh:
    path: "{hadcrut5_data}/HadCRUT.5.2.0.0.analysis.ensemble_series.northern_hemisphere.monthly.nc"
    description: "HadCRUT5 v5.2.0.0 Northern Hemisphere mean monthly anomaly series (rel. 1961-1990), 200 realizations, 1850-2026/09"
    product: hadcrut5
    version: "5.2.0.0"
    variable: tas
    kind: members
    region: nh
    var: tas
    version_check: {attr: version, contains: "HadCRUT.5.2.0.0"}

  instr_crutem5_5.0.2.0_lsat_mean:
    path: "{crutem5_data}/CRUTEM.5.0.2.0.anomalies.nc"
    description: "CRUTEM5 v5.0.2.0 land air temperature monthly anomalies (rel. 1961-1990), 5x5 deg, not infilled"
    product: crutem5
    version: "5.0.2.0"
    variable: lsat
    kind: mean
    var: tas
    version_check: {attr: version, contains: "CRUTEM.5.0.2.0"}

  # Berkeley Earth has no release numbers: each monthly update is identified
  # by the build stamp in its `source_file` attribute (here 2025-01-09).
  instr_berkeley_earth_20250109_lsat_mean:
    path: "{berkeley_earth_data}/Complete_TAVG_LatLong1.nc"
    description: "Berkeley Earth land-only TAVG monthly anomalies (rel. 1951-1980), 1x1 deg, 1750-2024, build of 2025-01-09"
    product: berkeley_earth
    version: "20250109"
    variable: lsat
    kind: mean
    var: temperature
    version_check: {attr: source_file, contains: ".20250109T"}

  instr_dcent_i_1.1.0.0_tas_mean:
    path: "{dcent_data}/v1.1.0/DCENT_I_1.1.0.0_mean_spread_ts.nc"
    description: "DCENT-I v1.1.0.0 (infilled DCENT) ensemble-mean blended surface temperature monthly anomalies (rel. 1982-2014), 5x5 deg"
    product: dcent_i
    version: "1.1.0.0"
    variable: tas
    kind: mean
    var: ts_mean
    version_check: {attr: version, contains: "1.1.0.0"}

  instr_dcent_i_1.1.0.0_lsat_mean:
    path: "{dcent_data}/v1.1.0/DCENT_I_1.1.0.0_mean_spread_lsat.nc"
    description: "DCENT-I v1.1.0.0 ensemble-mean land surface air temperature monthly anomalies (rel. 1982-2014), 5x5 deg"
    product: dcent_i
    version: "1.1.0.0"
    variable: lsat
    kind: mean
    var: lsat_mean
    version_check: {attr: version, contains: "1.1.0.0"}

  instr_dcent_i_1.1.0.0_sst_mean:
    path: "{dcent_data}/v1.1.0/DCENT_I_1.1.0.0_mean_spread_sst.nc"
    description: "DCENT-I v1.1.0.0 ensemble-mean sea surface temperature monthly anomalies (rel. 1982-2014), 5x5 deg"
    product: dcent_i
    version: "1.1.0.0"
    variable: sst
    kind: mean
    var: sst_mean
    version_check: {attr: version, contains: "1.1.0.0"}

  # Member files hold all three variables (ts, lsat, sst), one realization each.
  instr_dcent_i_1.1.0.0_tas_members:
    path: "{dcent_data}/v1.1.0/DCENT_I_1.1.0.0_member_*.nc"
    description: "DCENT-I v1.1.0.0, 200 ensemble members, blended surface temperature monthly anomalies (rel. 1982-2014), 5x5 deg"
    product: dcent_i
    version: "1.1.0.0"
    variable: tas
    kind: members
    var: ts
    version_check: {attr: version, contains: "1.1.0.0"}

  instr_dcent_i_1.1.0.0_lsat_members:
    path: "{dcent_data}/v1.1.0/DCENT_I_1.1.0.0_member_*.nc"
    description: "DCENT-I v1.1.0.0, 200 ensemble members, land surface air temperature monthly anomalies (rel. 1982-2014), 5x5 deg"
    product: dcent_i
    version: "1.1.0.0"
    variable: lsat
    kind: members
    var: lsat
    version_check: {attr: version, contains: "1.1.0.0"}

  instr_dcent_i_1.1.0.0_sst_members:
    path: "{dcent_data}/v1.1.0/DCENT_I_1.1.0.0_member_*.nc"
    description: "DCENT-I v1.1.0.0, 200 ensemble members, sea surface temperature monthly anomalies (rel. 1982-2014), 5x5 deg"
    product: dcent_i
    version: "1.1.0.0"
    variable: sst
    kind: members
    var: sst
    version_check: {attr: version, contains: "1.1.0.0"}

# Plot colors for the products ce_fields serves, so every project draws a
# given product the same way (DataConfig.get_plot_color). Formerly kept in
# ce_val; downstream repos fall back to these for keys they don't define.
plot_styles:
  colors:
    # Last Millennium Reanalysis (in publication order)
    lmr_v2_1: "#1f77b4"      # Blue - published 2019
    lmr_online: "#be0119"    # Scarlet - published 2021
    lmr_seasonal: "#ff7f0e"  # Orange - published 2025

    # Neukom et al. (2019) multi-method field reconstructions (validated
    # distinct from each other and from the LMR colors with the dataviz
    # skill's validate_palette.js)
    neukom_am: "#a0522d"       # Sienna
    neukom_cca: "#9467bd"      # Purple
    neukom_cps: "#17becf"      # Cyan
    neukom_da: "#d62728"       # Red
    neukom_graphem: "#e377c2"  # Pink
    neukom_pcr: "#bf9000"      # Goldenrod

    # Instrumental products (keys = Instrumental product names); one shared
    # hue, as in docu_val/borehole_val -- vary line style to tell them apart
    hadcrut5: "yellowgreen"
    crutem5: "yellowgreen"
    berkeley_earth: "yellowgreen"
    dcent_i: "yellowgreen"

# Current environment (can be overridden)
current_environment: "laptop"
